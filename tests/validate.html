<script>
(function () {
  var lines = [], fail = 0;
  function check(ok, msg) { lines.push((ok ? 'OK    ' : 'GAGAL ') + msg); if (!ok) fail++; }
  function near(a, b) { return Math.abs(a - b) < 1e-9; }
  function candlesOk(ex) {
    return ex.candles.every(function (c) { return c.h >= Math.max(c.o, c.c) && c.l <= Math.min(c.o, c.c); });
  }

  /* ===== Deteksi struktur (definisi baku CLAUDE.md) ===== */
  var K = 2; // swing = high/low lebih ekstrem dari K candle kiri dan K candle kanan (wick dihitung untuk swing)

  // Swing high/low. Hasil: [{i, type:'H'|'L', price}] urut index.
  function detectSwings(cs) {
    var out = [];
    for (var i = K; i < cs.length - K; i++) {
      var isH = true, isL = true;
      for (var d = -K; d <= K; d++) {
        if (!d) continue;
        if (cs[i + d].h >= cs[i].h) isH = false;
        if (cs[i + d].l <= cs[i].l) isL = false;
      }
      if (isH) out.push({ i: i, type: 'H', price: cs[i].h });
      if (isL) out.push({ i: i, type: 'L', price: cs[i].l });
    }
    return out;
  }

  // Label tiap swing: HH/LH (dibanding swing high sebelumnya), HL/LL (swing low). Swing pertama: SH / SL.
  function labelSwings(sw) {
    var lastH = null, lastL = null;
    return sw.map(function (s) {
      var lab;
      if (s.type === 'H') { lab = lastH === null ? 'SH' : (s.price > lastH ? 'HH' : 'LH'); lastH = s.price; }
      else { lab = lastL === null ? 'SL' : (s.price > lastL ? 'HL' : 'LL'); lastL = s.price; }
      return { i: s.i, type: s.type, price: s.price, label: lab };
    });
  }

  // Tren dari dua swing high dan dua swing low terakhir: 'up' (HH+HL), 'down' (LH+LL), selain itu 'mixed'.
  function trendOf(highs, lows) {
    if (highs.length < 2 || lows.length < 2) return 'mixed';
    var h1 = highs[highs.length - 1].price, h0 = highs[highs.length - 2].price;
    var l1 = lows[lows.length - 1].price, l0 = lows[lows.length - 2].price;
    if (h1 > h0 && l1 > l0) return 'up';
    if (h1 < h0 && l1 < l0) return 'down';
    return 'mixed';
  }

  // BOS / CHoCH: BODY CLOSE (bukan wick) melewati swing high/low terakhir yang sudah terkonfirmasi
  // (swing i dikenal setelah candle i+K selesai) dan belum pernah ditembus body close.
  // Searah tren = BOS, berlawanan tren = CHoCH. Hasil: [{j, dir, level, levelIdx, trend, kind}]
  function detectBreaks(cs) {
    var sw = detectSwings(cs), out = [];
    for (var j = 0; j < cs.length; j++) {
      var conf = sw.filter(function (s) { return s.i + K < j; });
      var highs = conf.filter(function (s) { return s.type === 'H'; });
      var lows = conf.filter(function (s) { return s.type === 'L'; });
      var trend = trendOf(highs, lows);
      [['up', highs], ['down', lows]].forEach(function (p) {
        var dir = p[0], arr = p[1];
        if (!arr.length) return;
        var s = arr[arr.length - 1];
        var beyond = function (c) { return dir === 'up' ? c.c > s.price : c.c < s.price; };
        if (!beyond(cs[j])) return;
        for (var m = s.i + 1; m < j; m++) if (beyond(cs[m])) return; // sudah pernah ditembus
        var kind = 'none';
        if (trend !== 'mixed') kind = (trend === dir) ? 'BOS' : 'CHoCH';
        out.push({ j: j, dir: dir, level: s.price, levelIdx: s.i, trend: trend, kind: kind });
      });
    }
    return out;
  }

  // IFVG: FVG yang ditembus BODY CLOSE berlawanan (breached) -> zona berbalik peran.
  // bull FVG tertembus ke bawah = IFVG 'bear' (resisten); bear FVG tertembus ke atas = IFVG 'bull' (support).
  // Hasil: [{i1, k, dir, top, bottom, closeBeyond}] k = candle body close yang menembus.
  function detectIFVG(cs) {
    return VyChart.detectFVG(cs).filter(function (f) { return f.breached; }).map(function (f) {
      var c = cs[f.breachIndex];
      return { i1: f.i1, k: f.breachIndex, dir: f.dir === 'bull' ? 'bear' : 'bull', top: f.top, bottom: f.bottom,
               closeBeyond: f.dir === 'bull' ? c.c < f.bottom : c.c > f.top };
    });
  }

  // OB: candle berlawanan TERAKHIR sebelum impuls yang body close menembus swing (BOS/CHoCH),
  // dan candle berikutnya close melewati sisi OB (gerak kuat). Hasil: [{i, dir, top, bottom, j, level, levelIdx}]
  function detectOB(cs) {
    var out = [];
    detectBreaks(cs).forEach(function (e) {
      var up = e.dir === 'up', m = e.j - 1;
      while (m >= 0 && (up ? cs[m].c >= cs[m].o : cs[m].c <= cs[m].o)) m--;
      if (m < 0 || m <= e.levelIdx) return;
      var o = cs[m], nx = cs[m + 1];
      if (up ? !(nx.c > o.h) : !(nx.c < o.l)) return;
      out.push({ i: m, dir: up ? 'bull' : 'bear', top: o.h, bottom: o.l, j: e.j, level: e.level, levelIdx: e.levelIdx });
    });
    return out;
  }

  // Posisi: hasil = 'TP' / 'SL' / '?' (urut candle mulai candle entry; satu candle kena dua-duanya = ambigu '?').
  function outcome(cs, pos) {
    var long = pos.side === 'long';
    for (var k = pos.i; k < cs.length; k++) {
      var hitSl = long ? cs[k].l <= pos.sl : cs[k].h >= pos.sl;
      var hitTp = long ? cs[k].h >= pos.tp : cs[k].l <= pos.tp;
      if (hitSl && hitTp) return '?';
      if (hitSl) return 'SL';
      if (hitTp) return 'TP';
    }
    return 'belum';
  }

  /* ===== Candlestick ===== */
  window.EXAMPLES.candlestick.forEach(function (ex) {
    check(candlesOk(ex), ex.id + ': semua candle OHLC konsisten');
    var up = ex.candles.filter(function (c) { return c.c > c.o; }).length;
    var dn = ex.candles.filter(function (c) { return c.c < c.o; }).length;
    check(up > 0 && dn > 0, ex.id + ': ada candle naik (' + up + ') dan turun (' + dn + ')');
  });
  // label "Naik"/"Turun" di contoh 1 harus menunjuk candle yang benar
  (function () {
    var ex = window.EXAMPLES.candlestick[0];
    var n = ex.overlays.filter(function (o) { return /^Naik/.test(o.text || ''); })[0];
    var t = ex.overlays.filter(function (o) { return /^Turun/.test(o.text || ''); })[0];
    check(ex.candles[n.i].c > ex.candles[n.i].o, ex.id + ': label "Naik" di candle naik (' + n.i + ')');
    check(ex.candles[t.i].c < ex.candles[t.i].o, ex.id + ': label "Turun" di candle turun (' + t.i + ')');
  })();
  (function () {
    var ex = window.EXAMPLES.candlestick[1], cs = ex.candles;
    var a = ex.overlays[0], b = ex.overlays[1];
    var body = function (c) { return Math.abs(c.c - c.o); };
    check((cs[a.i].h - Math.max(cs[a.i].o, cs[a.i].c)) > 2 * body(cs[a.i]), ex.id + ': wick atas candle ' + a.i + ' lebih panjang dari 2x body');
    check((Math.min(cs[b.i].o, cs[b.i].c) - cs[b.i].l) > 2 * body(cs[b.i]), ex.id + ': wick bawah candle ' + b.i + ' lebih panjang dari 2x body');
  })();

  /* ===== Swing HH/HL/LH/LL ===== */
  window.EXAMPLES.swing.forEach(function (ex) {
    check(candlesOk(ex), ex.id + ': semua candle OHLC konsisten');
    var lab = labelSwings(detectSwings(ex.candles));
    ex.overlays.forEach(function (o) {
      var s = lab.filter(function (x) { return x.i === o.i && x.type === o.at; })[0];
      check(!!s, ex.id + ': candle ' + o.i + ' adalah swing ' + (o.at === 'H' ? 'high' : 'low'));
      if (!s) return;
      check(s.label === o.swing, ex.id + ': candle ' + o.i + ' berlabel ' + o.swing + ' (deteksi: ' + s.label + ')');
      check(near(s.price, o.y), ex.id + ': harga label = ' + (o.at === 'H' ? 'high' : 'low') + ' swing (' + s.price + ')');
    });
    // tren konsisten: uptrend hanya HH/HL, downtrend hanya LH/LL
    var labs = lab.map(function (x) { return x.label; });
    var up = ex.id === 'swing-up';
    var bad = labs.filter(function (l) { return up ? (l === 'LH' || l === 'LL') : (l === 'HH' || l === 'HL'); });
    check(bad.length === 0, ex.id + ': urutan swing murni ' + (up ? 'HH/HL' : 'LH/LL') + ' [' + labs.join(' ') + ']');
  });

  /* ===== BOS, CHoCH (dan sweep) ===== */
  function checkStructure(ex) {
    var cs = ex.candles;
    check(candlesOk(ex), ex.id + ': semua candle OHLC konsisten');
    var ln = ex.overlays.filter(function (o) { return o.type === 'line' && o.struct; })[0];
    check(!!ln, ex.id + ': ada garis level struktur');
    var ev = detectBreaks(cs);
    var st = ln.struct;

    if (st.kind === 'sweep') {
      // wick melewati level, body TIDAK pernah close melewati level -> bukan CHoCH
      var wick = cs[ln.i2];
      var up = st.dir === 'up';
      check(up ? wick.h > ln.y : wick.l < ln.y, ex.id + ': wick candle ' + ln.i2 + ' melewati level ' + ln.y);
      check(up ? Math.max(wick.o, wick.c) <= ln.y : Math.min(wick.o, wick.c) >= ln.y, ex.id + ': body candle ' + ln.i2 + ' TIDAK melewati level');
      var swing = detectSwings(cs).filter(function (s) { return s.i === ln.i1 && s.type === (up ? 'H' : 'L'); })[0];
      check(!!swing && near(swing.price, ln.y), ex.id + ': level = ' + (up ? 'high' : 'low') + ' swing candle ' + ln.i1);
      var closes = cs.some(function (c, k) { return k > ln.i1 + K && (up ? c.c > ln.y : c.c < ln.y); });
      check(!closes, ex.id + ': tidak ada body close melewati level (bukan CHoCH)');
      check(!ev.some(function (e) { return e.kind === 'CHoCH'; }), ex.id + ': deteksi tidak menemukan CHoCH sama sekali');
    } else {
      var e = ev.filter(function (x) { return x.j === ln.i2 && x.dir === st.dir; })[0];
      check(!!e, ex.id + ': deteksi menemukan tembusan body close di candle ' + ln.i2);
      if (e) {
        check(near(e.level, ln.y), ex.id + ': level garis = swing (' + e.level + ')');
        check(e.levelIdx === ln.i1, ex.id + ': garis mulai dari candle swing ' + e.levelIdx);
        check(e.kind === st.kind, ex.id + ': jenis = ' + st.kind + ' (deteksi: ' + e.kind + ', tren sebelumnya: ' + e.trend + ')');
        var c = cs[e.j];
        check(st.dir === 'up' ? c.c > e.level : c.c < e.level, ex.id + ': candle tembus punya BODY CLOSE melewati level');
        // candle sebelum titik tembus tidak boleh sudah close melewati level
        var early = false;
        for (var m = e.levelIdx + 1; m < e.j; m++) if (st.dir === 'up' ? cs[m].c > e.level : cs[m].c < e.level) early = true;
        check(!early, ex.id + ': tidak ada body close lebih awal melewati level');
        // label teks di chart
        check(ln.label === st.kind, ex.id + ': label garis = "' + ln.label + '"');
      }
    }

    // Entry di FVG / OB, SL, TP RR 1:2
    var pos = ex.overlays.filter(function (o) { return o.type === 'position'; })[0];
    var zone = ex.overlays.filter(function (o) { return o.type === 'zone'; })[0];
    if (!pos) return;
    var long = pos.side === 'long';
    var touched = cs[pos.i].l <= pos.entry && cs[pos.i].h >= pos.entry;
    check(touched, ex.id + ': harga menyentuh entry di candle ke-' + pos.i);
    var rr = Math.abs(pos.tp - pos.entry) / Math.abs(pos.entry - pos.sl);
    check(near(rr, 2), ex.id + ': RR = 1:' + rr);
    check(long ? (pos.sl < pos.entry && pos.tp > pos.entry) : (pos.sl > pos.entry && pos.tp < pos.entry), ex.id + ': SL/TP di sisi yang benar untuk ' + pos.side);
    var res = outcome(cs, pos);
    check(res === (ex.valid ? 'TP' : 'SL'), ex.id + ': hasil posisi = ' + res + ' (harapan: ' + (ex.valid ? 'TP' : 'SL') + ')');
    if (!zone) return;
    check(zone.i1 < pos.i, ex.id + ': zona terbentuk sebelum entry');
    var mid = (zone.top + zone.bottom) / 2;
    check(near(pos.entry, mid), ex.id + ': entry = 50% zona (' + mid + ')');
    check(long ? pos.sl < zone.bottom : pos.sl > zone.top, ex.id + ': SL di luar sisi jauh zona');
    // zona belum ditembus body close berlawanan sampai candle entry
    var pierced = false;
    for (var q = zone.i1 + 3; q <= pos.i; q++) if (long ? cs[q].c < zone.bottom : cs[q].c > zone.top) pierced = true;
    check(!pierced, ex.id + ': zona belum ditembus body close sampai entry');
    if (zone.kind === 'FVG') {
      var d = VyChart.detectFVG(cs).filter(function (f) { return f.i1 === zone.i1; })[0];
      check(!!d, ex.id + ': FVG terdeteksi di candle ke-' + zone.i1);
      if (d) {
        check(near(d.top, zone.top) && near(d.bottom, zone.bottom), ex.id + ': zona gambar = zona deteksi FVG (' + d.bottom + '–' + d.top + ')');
        check((d.dir === 'bull') === long, ex.id + ': arah FVG sesuai posisi');
        check(d.i3 <= pos.i, ex.id + ': FVG selesai terbentuk sebelum entry');
      }
    } else if (zone.kind === 'OB') {
      var o = cs[zone.i1], nx = cs[zone.i1 + 1];
      check(near(o.h, zone.top) && near(o.l, zone.bottom), ex.id + ': zona OB = high–low candle ' + zone.i1);
      check(long ? o.c < o.o : o.c > o.o, ex.id + ': candle OB berlawanan arah (' + (long ? 'turun' : 'naik') + ' untuk OB ' + (long ? 'bullish' : 'bearish') + ')');
      check(long ? nx.c > o.h : nx.c < o.l, ex.id + ': candle berikutnya close menembus sisi OB (displacement)');
      // OB = candle berlawanan TERAKHIR sebelum impuls: semua candle sesudahnya sampai titik tembus searah impuls
      var allDir = true;
      for (var r = zone.i1 + 1; r <= ln.i2; r++) if (long ? cs[r].c <= cs[r].o : cs[r].c >= cs[r].o) allDir = false;
      check(allDir, ex.id + ': OB adalah candle berlawanan terakhir sebelum impuls yang menembus struktur');
    }
  }
  window.EXAMPLES.bos.forEach(checkStructure);
  window.EXAMPLES.choch.forEach(checkStructure);
  check(window.EXAMPLES.bosvschoch.length === 2, 'bosvschoch: 2 contoh berdampingan');

  /* ===== Pengecekan fungsi deteksi sendiri (kasus kecil) ===== */
  (function () {
    // wick menembus tapi body tidak close: tidak boleh jadi BOS/CHoCH
    var base = window.VyData.head([[2658, .5, .6], [2661, .6, .6], [2663.5, 3.5, .6], [2660, .5, .6]]);
    check(detectBreaks(base).every(function (e) { return e.j !== 20; }), 'deteksi: wick tembus tanpa body close TIDAK dihitung tembusan');
    // body close menembus: dihitung
    var base2 = window.VyData.head([[2658, .5, .6], [2661, .6, .6], [2667, .5, .6], [2660, .5, .6]]);
    check(detectBreaks(base2).some(function (e) { return e.j === 20 && e.kind === 'CHoCH'; }), 'deteksi: body close menembus LH di downtrend = CHoCH');
  })();

  /* ===== FVG (Tahap 1) ===== */
  window.EXAMPLES.fvg.forEach(function (ex) {
    var found = VyChart.detectFVG(ex.candles);
    var zones = ex.overlays.filter(function (o) { return o.type === 'zone' && (o.kind === 'FVG' || o.kind === 'OFF'); });
    var pos = ex.overlays.filter(function (o) { return o.type === 'position'; })[0];
    check(zones.length === 1, ex.id + ': ada 1 zona FVG di overlay');
    var z = zones[0];
    var d = found.filter(function (f) { return f.i1 === z.i1; })[0];
    check(!!d, ex.id + ': FVG terdeteksi di candle ke-' + z.i1);
    if (d) {
      check(near(d.top, z.top) && near(d.bottom, z.bottom), ex.id + ': zona gambar = zona deteksi (' + d.bottom + '–' + d.top + ')');
      check(d.breached === !ex.valid, ex.id + ': status tertembus = ' + d.breached + ' (harapan: ' + !ex.valid + ')');
      if (ex.valid) check(z.i2 < ex.candles.length, ex.id + ': zona belum ditembus sampai akhir');
      var mid = (d.top + d.bottom) / 2;
      check(near(pos.entry, mid), ex.id + ': entry = 50% zona (' + mid + ')');
      var long = d.dir === 'bull';
      check((pos.side === 'long') === long, ex.id + ': arah posisi sesuai FVG (' + pos.side + ')');
      var sl = long ? d.bottom : d.top;
      check(long ? pos.sl < sl : pos.sl > sl, ex.id + ': SL di luar sisi jauh zona');
      var rr = Math.abs(pos.tp - pos.entry) / Math.abs(pos.entry - pos.sl);
      check(near(rr, 2), ex.id + ': RR = 1:' + rr);
    }
    check(candlesOk(ex), ex.id + ': semua candle OHLC konsisten');
    var touched = ex.candles[pos.i].l <= pos.entry && ex.candles[pos.i].h >= pos.entry;
    check(touched, ex.id + ': harga menyentuh entry di candle ke-' + pos.i);
  });

  /* ===== FVG: minimal 2 valid (bullish + bearish) + 1 belum valid ===== */
  check(window.EXAMPLES.fvg.filter(function (e) { return e.valid && /bull/.test(e.id); }).length >= 1 &&
        window.EXAMPLES.fvg.filter(function (e) { return e.valid && /bear/.test(e.id); }).length >= 1, 'fvg: ada contoh valid bullish dan bearish');
  check(window.EXAMPLES.fvg.some(function (e) { return e.valid === false; }), 'fvg: ada contoh BELUM VALID');

  /* ===== Posisi umum (entry, SL, TP) untuk contoh zona ===== */
  function checkPos(ex, zone, pos) {
    var cs = ex.candles, long = pos.side === 'long';
    check(cs[pos.i].l <= pos.entry && cs[pos.i].h >= pos.entry, ex.id + ': harga menyentuh entry di candle ke-' + pos.i);
    var rr = Math.abs(pos.tp - pos.entry) / Math.abs(pos.entry - pos.sl);
    check(near(rr, 2), ex.id + ': RR = 1:' + rr);
    check(long ? (pos.sl < pos.entry && pos.tp > pos.entry) : (pos.sl > pos.entry && pos.tp < pos.entry), ex.id + ': SL/TP di sisi yang benar untuk ' + pos.side);
    var mid = (zone.top + zone.bottom) / 2;
    check(near(pos.entry, mid), ex.id + ': entry = 50% zona (' + mid + ')');
    // SL di luar sisi jauh zona: long -> di bawah bawah zona, short -> di atas atas zona
    check(long ? pos.sl < zone.bottom : pos.sl > zone.top, ex.id + ': SL di luar sisi jauh zona');
    var res = outcome(cs, pos);
    check(res === (ex.valid ? 'TP' : 'SL'), ex.id + ': hasil posisi = ' + res + ' (harapan: ' + (ex.valid ? 'TP' : 'SL') + ')');
  }
  function posOf(ex) { return ex.overlays.filter(function (o) { return o.type === 'position'; })[0]; }
  function zoneOf(ex) { return ex.overlays.filter(function (o) { return o.type === 'zone'; })[0]; }

  /* ===== IFVG (Tahap 3) ===== */
  window.EXAMPLES.ifvg.forEach(function (ex) {
    var cs = ex.candles, z = zoneOf(ex), pos = posOf(ex), long = pos.side === 'long';
    check(candlesOk(ex), ex.id + ': semua candle OHLC konsisten');
    var f = VyChart.detectFVG(cs).filter(function (x) { return x.i1 === z.i1; })[0];
    check(!!f, ex.id + ': FVG asal terdeteksi di candle ke-' + z.i1);
    if (!f) return;
    check(near(f.top, z.top) && near(f.bottom, z.bottom), ex.id + ': zona gambar = zona FVG deteksi (' + f.bottom + '–' + f.top + ')');
    var d = detectIFVG(cs).filter(function (x) { return x.i1 === z.i1; })[0];
    if (ex.valid) {
      check(!!d, ex.id + ': IFVG terdeteksi (FVG ditembus body close)');
      if (!d) return;
      check(d.k === ex.meta.breakAt, ex.id + ': titik tembus = candle ' + d.k + ' (digambar: ' + ex.meta.breakAt + ')');
      check(d.closeBeyond, ex.id + ': candle tembus BODY CLOSE melewati sisi jauh zona');
      check(z.kind === 'IFVG' && z.label === 'IFVG', ex.id + ': zona berlabel IFVG');
      // peran berbalik: FVG bull tertembus -> posisi short, FVG bear tertembus -> posisi long

  /* ===== Lanjut (Tahap 7): liquidity sweep, premium/discount, SMT, sesi ===== */
  var EQ_TOL = 0.6; // dua swing dianggap "equal" kalau selisih harga <= 0.6 (skala XAUUSD)

  // EQH/EQL: dua swing sejenis yang berurutan dan sejajar. Hasil: [{side:'high'|'low', i1, i2, level}]
  // level = batas terluar kedua swing (EQH: yang tertinggi, EQL: yang terendah).
  function detectEqual(cs) {
    var sw = detectSwings(cs), out = [];
    ['H', 'L'].forEach(function (t) {
      var arr = sw.filter(function (x) { return x.type === t; });
      for (var k = 1; k < arr.length; k++) {
        if (Math.abs(arr[k].price - arr[k - 1].price) > EQ_TOL) continue;
        var pa = arr[k - 1].price, pb = arr[k].price;
        out.push({ side: t === 'H' ? 'high' : 'low', i1: arr[k - 1].i, i2: arr[k].i, level: t === 'H' ? Math.max(pa, pb) : Math.min(pa, pb) });
      }
    });
    return out;
  }

  // Sweep: candle PERTAMA setelah EQH/EQL yang wick-nya melewati level.
  //  - close kembali ke dalam  -> kind 'sweep'
  //  - close melewati level    -> kind 'break' (bukan sweep); held = 3 candle berikutnya tetap close di luar level
  // Hasil: [{side, i1, i2, j, level, kind, held}]
  function detectSweeps(cs) {
    var out = [];
    detectEqual(cs).forEach(function (e) {
      var low = e.side === 'low';
      for (var j = e.i2 + 1; j < cs.length; j++) {
        var c = cs[j];
        if (!(low ? c.l < e.level : c.h > e.level)) continue;
        var closeBeyond = low ? c.c < e.level : c.c > e.level;
        var held = closeBeyond;
        for (var q = j + 1; q <= Math.min(j + 3, cs.length - 1); q++) if (!(low ? cs[q].c < e.level : cs[q].c > e.level)) held = false;
        out.push({ side: e.side, i1: e.i1, i2: e.i2, j: j, level: e.level, kind: closeBeyond ? 'break' : 'sweep', held: held });
        break;
      }
    });
    return out;
  }

  // SMT: bandingkan swing sejenis yang berurutan di aset A dan B (swing B boleh geser 1 candle).
  // Divergensi = satu aset membuat high/low baru, aset lain GAGAL. Hasil: [{dir, ia, ib, leader:'A'|'B'}]
  function detectSMT(A, B) {
    var sa = detectSwings(A), sb = detectSwings(B), out = [];
    function nearSwing(arr, i) { return arr.filter(function (x) { return Math.abs(x.i - i) <= 1; })[0]; }
    ['H', 'L'].forEach(function (t) {
      var a = sa.filter(function (x) { return x.type === t; }), b = sb.filter(function (x) { return x.type === t; });
      for (var k = 1; k < a.length; k++) {
        var p0 = a[k - 1], p1 = a[k], q0 = nearSwing(b, p0.i), q1 = nearSwing(b, p1.i);
        if (!q0 || !q1) continue;
        var aNew = t === 'H' ? p1.price > p0.price : p1.price < p0.price;
        var bNew = t === 'H' ? q1.price > q0.price : q1.price < q0.price;
        if (aNew !== bNew) out.push({ dir: t === 'H' ? 'bear' : 'bull', ia: p0.i, ib: p1.i, leader: aNew ? 'A' : 'B' });
      }
    });
    return out;
  }

  // Posisi tanpa zona (contoh salah): sentuh entry, RR 1:2, sisi SL/TP benar, hasil sesuai harapan.

    check(long ? (pos.sl < pos.entry && pos.tp > pos.entry) : (pos.sl > pos.entry && pos.tp < pos.entry), ex.id + ': SL/TP di sisi yang benar untuk ' + pos.side);
    var res = outcome(cs, pos);

        var chv = chochAt(ex, pos, p, mt.breakAt, long ? 'up' : 'down');
        check(!!chv && near(chv.level, long ? z.top : z.bottom), p + 'level CHoCH = sisi jauh OB (' + (long ? z.top : z.bottom) + '), candle yang sama dengan penembus zona');
        check(z.kind === 'BB' && z.label === 'Breaker', p + 'zona berlabel Breaker');
        check(ex.overlays.some(function (x) { return x.type === 'text' && /^OB (bearish|bullish)$/.test(x.text); }), p + 'label OB asal di chart');
        var back = false; for (var q = mt.breakAt + 1; q <= pos.i; q++) if (long ? cs[q].c < z.bottom : cs[q].c > z.top) back = true;
        check(!back, p + 'zona belum ditembus balik sampai entry');
        check(near(pos.entry, r2((z.top + z.bottom) / 2)) && (long ? pos.sl < z.bottom : pos.sl > z.top), p + 'entry 50% zona, SL di luar sisi jauh');
        check(pos.i > mt.breakAt && firstTouch(cs, mt.breakAt + 1, pos.entry) === pos.i, p + 'entry SETELAH tembus, saat harga kembali (retest) pertama ke 50% zona (candle ' + pos.i + ')');
      } else {
        check(!brs, p + 'OB belum ditembus body close: BUKAN breaker');
        var w = cs[25];
        check(w.h > z.top && w.c < z.top && Math.max(w.o, w.c) < z.top, p + 'candle 25: wick (' + r2(w.h) + ') melewati high OB ' + r2(z.top) + ', tetapi body close ' + r2(w.c) + ' tetap di bawah');
        check(near(pos.entry, r2((z.top + z.bottom) / 2)) && pos.side === 'long', p + 'LP di 50% zona yang masih berupa OB bearish -> kena SL');
      }
    });

    /* ---------- Kelengkapan kartu baru: materi, flashcard, glosarium, kuis ---------- */
    var NEW = { hammer: 'Dasar', engulfing: 'Dasar', doji: 'Dasar', expansion: 'Struktur', consolidation: 'Struktur', reversal: 'Struktur', breaker: 'Zona' };
    Object.keys(NEW).forEach(function (k) {
      var c = window.CONCEPTS.filter(function (x) { return x.id === k; })[0];
      check(!!c && c.examples === k && !!(c.apa && c.cara && c.syarat && c.salah), 'kartu ' + k + ': ada, 4 bagian lengkap, contoh = ' + k);
      var parts = [c.apa, c.cara, c.syarat, c.salah].map(function (t) { return (t.match(/[.!?](\s|$)/g) || []).length; });
      check(parts.every(function (n) { return n >= 1 && n <= 3; }), 'kartu ' + k + ': tiap bagian 1–3 kalimat (' + parts.join(',') + ')');
      var nQ = window.QUIZ.filter(function (q) { return q.tag === k; }).length;
      check(nQ >= 3, 'kuis: tag "' + k + '" punya ' + nQ + ' soal (minimal 3)');
      check(window.FLASHCARDS.some(function (f) { return f.id === k; }), 'flashcard: kartu "' + k + '" ada');
      check(window.GLOSSARY.some(function (g) { return g.link === k; }), 'glosarium: ada istilah yang menaut ke kartu "' + k + '"');
      var ex = EX[k], allTx = ex.map(function (e) { return JSON.stringify(e.overlays); }).join(' ');
      check(ex.every(function (e) { return !!e.hint && e.overlays.some(function (o) { return o.type === 'position'; }); }), k + ': tiap contoh punya petunjuk tebak dan kotak LP/SP + SL/TP');
      check(/"kind":"(FVG|OB|BB)"/.test(allTx), k + ': ada zona berlabel FVG/OB di overlay');
    });
    ['Hammer', 'Shooting star', 'Engulfing', 'Inside bar', 'Doji', 'Marubozu', 'Candle expansion (displacement)', 'Consolidation', 'Breakout', 'Fakeout', 'Reversal', 'Continuation', 'Breaker block'].forEach(function (t) {
      check(window.GLOSSARY.some(function (g) { return g.t === t; }), 'glosarium: istilah "' + t + '" ada');
    });
    check(window.QUIZ.filter(function (q) { return q.cat === 'dasar'; }).length >= 7 + 11, 'kuis Dasar bertambah (hammer, engulfing, doji)');
    check(window.CONCEPTS.filter(function (c) { return c.id === 'breaker'; })[0].syarat.indexOf('bervariasi antar trader') >= 0 && window.GLOSSARY.filter(function (g) { return g.t === 'Breaker block'; })[0].arti.indexOf('bervariasi antar trader') >= 0, 'breaker: catatan "definisi bervariasi antar trader" tampil di kartu dan glosarium');
    check(!window.CONCEPTS.some(function (c) { return /OCL/.test(JSON.stringify(c)); }) && !window.GLOSSARY.some(function (g) { return /OCL/.test(g.t + g.arti); }) && !window.QUIZ.some(function (q) { return /OCL/.test(JSON.stringify(q)); }), 'istilah OCL tidak ditambahkan (belum didefinisikan pengguna)');

    /* ---------- Peta belajar: penempatan kartu per level ---------- */
    var L = window.LEVELS, VP = window.VyProgres;
    function ids(l) { return VP.levelIds(l); }
    check(L.length === 4 && L.map(function (l) { return l.id; }).join() === 'l1,l2,l3,l4', 'peta: 4 level (l1, l2, l3, l4)');
    check(/Level 1/.test(L[0].title) && /Dasar/.test(L[0].title) && /Level 2/.test(L[1].title) && /Menengah/.test(L[1].title) && /Level 3/.test(L[2].title) && /Lanjut/.test(L[2].title) && /Level 4/.test(L[3].title) && /Expert/.test(L[3].title), 'peta: judul Level 1 Dasar, Level 2 Menengah, Level 3 Lanjut, Level 4 Expert');
    check(ids(L[0]).join() === 'candlestick,swing,hammer,engulfing,doji', 'peta Level 1: Candlestick, HH/HL/LH/LL + 3 baru (hammer, engulfing, doji)');
    var l2 = ids(L[1]);
    check(['bos', 'choch', 'bos-vs-choch', 'fvg', 'ifvg', 'ob', 'topdown', 'entry', 'sl', 'tp', 'noentry', 'expansion', 'consolidation', 'reversal', 'breaker'].every(function (k) { return l2.indexOf(k) >= 0; }) && l2.length === 15, 'peta Level 2: BOS, CHoCH, BOS vs CHoCH, FVG, IFVG, OB, Top-down, Eksekusi (4 kartu) + 4 baru = 15 kartu');
    check(L[1].sections.filter(function (s) { return s.h === 'Eksekusi'; })[0].ids.join() === 'entry,sl,tp,noentry', 'peta Level 2: bagian Eksekusi berisi entry, sl, tp, noentry');
    check(ids(L[2]).join() === 'liquidity,premdisc,smt,sesi', 'peta Level 3: Liquidity sweep, Premium & Discount, SMT, Sesi');
    check(L[3].soon === true && ids(L[3]).length === 0, 'peta Level 4: Segera hadir (belum ada kartu)');
    var seen = {}, dupIds = [], all = VP.allIds();
    all.forEach(function (id) { if (seen[id]) dupIds.push(id); seen[id] = true; });
    check(dupIds.length === 0, 'peta: tidak ada kartu ganda di dua level' + (dupIds.length ? ' -> ' + dupIds.join(',') : ''));
    check(all.every(function (id) { return !!window.LEVEL_SPECIAL[id] || window.CONCEPTS.some(function (c) { return c.id === id; }); }), 'peta: semua id kartu menunjuk materi yang ada');
    check(window.CONCEPTS.every(function (c) { return !!seen[c.id]; }), 'peta: tiap kartu materi (' + window.CONCEPTS.length + ') muncul tepat satu kali di peta (tautan lama tetap punya tempat)');
    check(window.LEVEL_SPECIAL.topdown.href === '#/belajar/topdown', 'peta: Top-down tetap menaut ke #/belajar/topdown');

    /* ---------- Peta belajar: logika progres ---------- */
    function fakeSt(init) { var m = Object.assign({}, init || {}); return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, _m: m }; }
    var s0 = VP.levelStats(L[0], {});
    check(s0.done === 0 && s0.total === 5 && s0.pct === 0, 'progres peta: belum ada yang dibuka -> 0/5 = 0%');
    var s1 = VP.levelStats(L[0], { candlestick: true, hammer: true });
    check(s1.done === 2 && s1.pct === 40, 'progres peta: 2 dari 5 kartu Level 1 dibuka = 40%');
    check(VP.levelStats(L[0], { candlestick: true, swing: true, hammer: true, engulfing: true, doji: true }).pct === 100, 'progres peta: semua kartu Level 1 dibuka = 100%');
    check(VP.levelStats(L[1], { bos: true, fvg: true, breaker: true }).pct === 20 && VP.levelStats(L[1], { bos: true }).pct === 7, 'progres peta: pembulatan persen Level 2 (3/15 = 20%, 1/15 = 7%)');
    check(VP.levelStats(L[0], { liquidity: true, sesi: true }).done === 0, 'progres peta: kartu level lain tidak dihitung di level ini');
    check(VP.levelStats(L[3], { bos: true }).pct === null && VP.levelStats(L[3], {}).total === 0, 'progres peta: Level 4 tanpa kartu -> persen kosong (Segera hadir)');
    var st = fakeSt();
    check(VP.markOpened('fvg', st) === true && VP.markOpened('fvg', st) === false && VP.load(st).opened.fvg === true, 'progres peta: kartu ditandai dibuka sekali (pemanggilan kedua tidak mengubah)');
    check(VP.markOpened('topdown', st) === true && VP.markOpened('tidak-ada', st) === false && !VP.load(st).opened['tidak-ada'], 'progres peta: Top-down bisa ditandai, id tak dikenal diabaikan');
    var stB = fakeSt({ 'vytrade.progress': JSON.stringify({ best: { dasar: { score: 5, total: 7 } }, hafal: { fvg: true } }) });
    VP.markOpened('bos', stB);
    var pB = VP.load(stB);
    check(pB.v === 2 && pB.best.dasar.score === 5 && pB.hafal.fvg === true && pB.opened.bos === true, 'progres peta: menandai kartu tidak menghapus skor kuis dan flashcard yang sudah ada');
    check(VP.load(fakeSt({ 'vytrade.progress': '{rusak' })).v === 2 && Object.keys(VP.load(fakeSt({ 'vytrade.progress': '{rusak' })).opened).length === 0, 'progres peta: data lokal rusak -> data kosong, tidak error');
    check(Object.keys(VP.load(fakeSt({ 'vytrade.progress': '{"v":9,"opened":{"bos":true}}' })).opened).length === 0, 'progres peta: data dari versi aplikasi lebih baru tidak dipakai (data kosong)');

    /* ---------- Migrasi progres dan cadangan lama ---------- */
    var old = { best: { dasar: { score: 5, total: 7 } }, hafal: { fvg: true, ob: false } };
    var mg = VP.migrate(old);
    check(mg.v === 2 && mg.best.dasar.score === 5 && mg.hafal.fvg === true && !mg.hafal.ob && Object.keys(mg.opened).length === 0, 'migrasi progres v1 -> v2: skor dan hafal utuh, opened kosong, nilai false dibuang');
    check(JSON.stringify(VP.migrate(mg)) === JSON.stringify(mg), 'migrasi progres: idempoten (migrasi data v2 tidak mengubah apa pun)');
    check(VP.migrate({ v: 2, best: {}, hafal: {}, opened: { bos: true, fvg: 0 } }).opened.bos === true && !VP.migrate({ v: 2, opened: { fvg: 0 } }).opened.fvg, 'migrasi progres: opened v2 dipertahankan (hanya nilai true)');
    check(VP.migrate(null).v === 2 && VP.migrate([1]) === null && VP.migrate('x') === null && VP.migrate({ v: 3 }) === null && VP.migrate({ v: 0 }) === null, 'migrasi progres: null -> kosong; array/teks/versi asing -> ditolak');
    var J = window.VyJurnal;
    var oldBackup = { app: 'VyTrade', schema: 1, exportedAt: '2026-01-01T00:00:00.000Z', data: { jurnal: { v: 1, entries: [] }, progress: old, setup: { dir: 'buy', checked: { b1: true } } } };
    var ob = J.validateBackup(JSON.stringify(oldBackup));
    check(ob.ok && ob.backup.schema === 2 && ob.backup.data.progress.v === 2 && ob.backup.data.progress.best.dasar.score === 5 && ob.backup.data.progress.hafal.fvg === true && Object.keys(ob.backup.data.progress.opened).length === 0, 'cadangan lama (schema 1): bisa diimpor, progres dimigrasi ke v2, skor dan hafal utuh');
    var tgt = fakeSt(); J.applyBackup(ob.backup, tgt);
    check(JSON.parse(tgt.getItem('vytrade.progress')).v === 2 && JSON.parse(tgt.getItem('vytrade.setup')).checked.b1 === true && VP.load(tgt).best.dasar.total === 7, 'cadangan lama: setelah diterapkan, progres tersimpan dalam skema baru dan checklist utuh');
    var newB = J.buildBackup(fakeSt({ 'vytrade.progress': JSON.stringify({ v: 2, best: {}, hafal: {}, opened: { bos: true, hammer: true } }) }), 1);
    check(newB.schema === 2 && newB.data.progress.opened.hammer === true, 'ekspor baru: schema 2 dan membawa kartu yang sudah dibuka');
    var rt = J.validateBackup(JSON.stringify(newB));
    check(rt.ok && rt.summary.dibuka === 2 && JSON.stringify(rt.backup.data.progress) === JSON.stringify(newB.data.progress), 'impor cadangan baru: kartu dibuka (2) pulih persis; cadangan hanya berisi kartu dibuka tidak dianggap kosong');
    var fut = JSON.parse(JSON.stringify(newB)); fut.schema = 3;
    var pf = JSON.parse(JSON.stringify(newB)); pf.data.progress.v = 9;
    check(!J.validateBackup(JSON.stringify(fut)).ok && !J.validateBackup(JSON.stringify(pf)).ok, 'impor: versi cadangan atau progres dari masa depan ditolak');
    var exOld = J.buildBackup(fakeSt({ 'vytrade.progress': JSON.stringify(old) }), 1);
    check(exOld.data.progress.v === 2 && exOld.data.progress.best.dasar.score === 5, 'ekspor dari data lokal lama (tanpa v): progres sudah dalam skema baru');
    check(J.buildBackup(fakeSt(), 1).data.progress === null, 'ekspor tanpa data progres: tetap null (tidak berubah jadi data kosong)');
  })();

  lines.push(fail ? ('TOTAL GAGAL: ' + fail) : 'SEMUA LOLOS');
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body></html>
