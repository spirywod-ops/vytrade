<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Smoke test VyTrade</title>
<style>
  body { margin: 0; font: 13px monospace; }
  #out { white-space: pre-wrap; padding: 8px; }
  iframe { width: 390px; height: 3000px; border: 0; display: block; }
</style></head>
<body>
<pre id="out">menjalankan...</pre>
<iframe id="f" title="app"></iframe>
<script>
/* Buka tiap halaman Belajar di iframe, cek chart tampil, lalu nyalakan/matikan tombol zona.
   Pakai: python -m http.server 8080, buka http://localhost:8080/tests/smoke.html
   Tambah ?ov=1 untuk membiarkan semua zona menyala (untuk screenshot), ?r=belajar/choch untuk satu halaman. */
(function () {
  var q = new URLSearchParams(location.search);
  var routes = q.get('r') ? [q.get('r')] :
    ['belajar', 'belajar/candlestick', 'belajar/swing', 'belajar/bos', 'belajar/choch', 'belajar/bos-vs-choch', 'belajar/fvg', 'belajar/ifvg', 'belajar/ob',
     'belajar/entry', 'belajar/sl', 'belajar/tp', 'belajar/noentry',
     'belajar/liquidity', 'belajar/premdisc', 'belajar/smt', 'belajar/sesi',
     'belajar/hammer', 'belajar/engulfing', 'belajar/doji', 'belajar/expansion', 'belajar/consolidation', 'belajar/reversal', 'belajar/breaker', 'belajar/cisd', 'belajar/qml', 'belajar/inducement', 'belajar/amd', 'belajar/tidak-ada',
     'belajar/topdown/bull/1d', 'belajar/topdown/bull/4h', 'belajar/topdown/bull/1h', 'belajar/topdown/bull/30m', 'belajar/topdown/bull/15m', 'belajar/topdown/bull/5m', 'belajar/topdown/bull/1m',
     'belajar/topdown/bear/1d', 'belajar/topdown/bear/4h', 'belajar/topdown/bear/1h', 'belajar/topdown/bear/30m', 'belajar/topdown/bear/15m', 'belajar/topdown/bear/5m', 'belajar/topdown/bear/1m',
     'belajar',
     'latihan', 'latihan/kuis', 'latihan/kuis/dasar', 'latihan/kuis/struktur', 'latihan/kuis/zona', 'latihan/kuis/topdown', 'latihan/kuis/checklist', 'latihan/kuis/eksekusi', 'latihan/kuis/lanjut',
     'latihan/flashcard', 'latihan/glosarium', 'setup', 'jurnal'];
  var keepOn = q.get('ov') === '1';
  var lines = [], fail = 0, f = document.getElementById('f'), idx = 0, errs = [];
  // Error di halaman uji sendiri (bukan di iframe aplikasi) ditampilkan, supaya uji yang macet tidak diam saja.
  window.addEventListener('error', function (e) { lines.push('GAGAL error di halaman uji: ' + e.message); fail++; document.getElementById('out').textContent = lines.join('\n'); });
  window.addEventListener('unhandledrejection', function (e) { lines.push('GAGAL promise ditolak di halaman uji: ' + (e.reason && e.reason.message || e.reason)); fail++; document.getElementById('out').textContent = lines.join('\n'); });
  function check(ok, msg) { lines.push((ok ? 'OK    ' : 'GAGAL ') + msg); if (!ok) fail++; }
  function done() {
    pRestore();
    if (pSaved) {
      var back = true;
      try { ALLKEYS.forEach(function (k) { if (localStorage.getItem(k) !== backups[k]) back = false; }); } catch (e) { back = false; }
      check(back, 'data pengguna (progres, jurnal, checklist) dipulihkan persis seperti sebelum uji');
    }
    lines.push(fail ? 'TOTAL GAGAL: ' + fail : 'SEMUA LOLOS');
    document.getElementById('out').textContent = lines.join('\n');
    // ?report=1: kirim hasil ke localhost:8081 (untuk uji otomatis tanpa layar)
    if (q.get('report')) { try { navigator.sendBeacon('http://localhost:8081/report', lines.join('\n')); } catch (e) { /* abaikan */ } }
  }

  /* ===== Tab Latihan (Tahap 5) ===== */
  // Smoke test memakai localStorage asli: cadangkan semua data pengguna di awal, pulihkan di akhir.
  var ALLKEYS = ['vytrade.progress', 'vytrade.jurnal', 'vytrade.setup'], backups = {}, pSaved = false;
  function pStart() {
    if (pSaved) return; pSaved = true;
    try { ALLKEYS.forEach(function (k) { backups[k] = localStorage.getItem(k); }); localStorage.removeItem('vytrade.progress'); } catch (e) {}
  }
  function pRestore() {
    if (!pSaved) return;
    try { ALLKEYS.forEach(function (k) { if (backups[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, backups[k]); }); } catch (e) {}
  }

  function svgToClient(svg, sx, sy) {
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return { x: r.left + sx * r.width / vb.width, y: r.top + sy * r.height / vb.height };
  }

  function latihanTest(r, w, d) {
    var V = d.getElementById('view'), cats = w.QUIZ_CATS;
    function ev(type, x, y) { return new w.MouseEvent(type, { bubbles: true, clientX: x, clientY: y }); }
    check(!/undefined|NaN/.test(V.innerHTML) && !/Segera hadir/.test(V.textContent), r + ': terisi, tanpa "undefined"/"NaN"/"Segera hadir"');

    if (r === 'latihan') {
      var menu = V.querySelectorAll('a.card.link');
      check(menu.length === 3 && /Kuis/.test(menu[0].textContent) && /Flashcard/.test(menu[1].textContent) && /Glosarium/.test(menu[2].textContent), 'latihan: tiga menu (Kuis, Flashcard, Glosarium)');
      check(V.querySelectorAll('#progres .row').length === cats.length + 1 && /Belum dicoba/.test(V.textContent) && /0\/\d+ hafal/.test(V.textContent), 'latihan: ringkasan progres (' + cats.length + ' kategori + flashcard) di atas menu');
    } else if (r === 'latihan/kuis') {
      var cl = V.querySelectorAll('a.card.link');
      check(cl.length === cats.length, 'kuis: ' + cl.length + ' kategori tampil');
    } else if (/^latihan\/kuis\//.test(r)) {
      var cat = r.split('/')[2], total = w.VyLatihan.questionsOf(cat).length, score = 0, n = 0, wrongSeen = false, rightSeen = false, zoneTried = 0;
      var guard = 0;
      while (guard++ < 120) {
        var qt = V.querySelector('.qtext'); if (!qt) break;
        var q = w.QUIZ.filter(function (x) { return x.q === qt.textContent && x.cat === cat; })[0];
        if (!q) { check(false, r + ': soal "' + qt.textContent + '" ada di data'); break; }
        n++;
        var wantRight = n % 2 === 1, got;
        if (q.type === 'zone') {
          var svg = V.querySelector('svg.chart');
          check(svg.classList.contains('ov-off'), r + ' ' + q.id + ': chart awalnya tanpa overlay');
          // tombol "Segera hadir"/zona tidak boleh bocor; cari kotak zona dari data contoh untuk simulasi ketukan
          var ex = null; Object.keys(w.EXAMPLES).forEach(function (k) { w.EXAMPLES[k].forEach(function (e) { if (e.id === q.ex) ex = e; }); });
          var zr = svg.querySelector('g.ov rect');
          var zx = +zr.getAttribute('x'), zy = +zr.getAttribute('y'), zw = +zr.getAttribute('width'), zh = +zr.getAttribute('height');
          var pt = wantRight ? svgToClient(svg, zx + zw / 2, zy + zh / 2) : svgToClient(svg, 12, 236);
          var box = V.querySelector('.chart-box.tap');
          box.dispatchEvent(ev('click', pt.x, pt.y));
          check(!svg.classList.contains('ov-off') && svg.querySelectorAll('.tap-mark').length === 1, r + ' ' + q.id + ': setelah ketuk, zona benar ditampilkan + tanda ketukan');
          zoneTried++;
          got = wantRight;
        } else {
          var btns = V.querySelectorAll('.opt'), pick = null;
          Array.prototype.forEach.call(btns, function (b) { if ((b.getAttribute('data-ok') === '1') === wantRight && !pick) pick = b; });
          pick.click(); got = wantRight;
        }
        var fb = V.querySelector('.feedback');
        check(fb.textContent.indexOf(q.expl) >= 0 && fb.textContent.indexOf(got ? 'Benar' : 'Belum tepat') >= 0, r + ' ' + q.id + ': jawab ' + (got ? 'benar' : 'salah') + ' -> penjelasan tampil');
        if (got) { score++; rightSeen = true; } else wrongSeen = true;
        var nx = V.querySelector('#next'); nx.click();
      }
      check(n === total, r + ': ' + n + ' dari ' + total + ' soal dimainkan');
      check(rightSeen && wrongSeen, r + ': jawaban benar dan salah sama-sama diuji');
      if (cat === 'zona') check(zoneTried >= 2, 'kuis zona: soal tebak zona diuji (' + zoneTried + ')');
      var sk = V.querySelector('#skor');
      check(!!sk && sk.textContent === score + '/' + total, r + ': skor akhir ' + (sk && sk.textContent) + ' (harap ' + score + '/' + total + ')');
      var best = w.VyLatihan.load().best[cat];
      check(!!best && best.score === score && best.total === total, r + ': skor terbaik tersimpan di localStorage');
    } else if (r === 'latihan/flashcard') {
      var total2 = w.FLASHCARDS.length, card = V.querySelector('#flash-card'), acts = V.querySelector('.pager');
      check(!!card && acts.hasAttribute('hidden'), 'flashcard: kartu depan tampil, tombol belum muncul');
      var front = card.querySelector('.flash-main').textContent;
      card.click();
      check(/Syarat valid/.test(card.textContent) && !acts.hasAttribute('hidden'), 'flashcard: ketuk -> arti + syarat valid, tombol muncul');
      V.querySelector('#flash-lagi').click();
      check(new RegExp('Sisa ' + total2 + ' kartu').test(V.textContent), 'flashcard: "Ulangi" -> kartu tetap di antrean (sisa ' + total2 + ')');
      var seen = {}, loops = 0;
      while (V.querySelector('#flash-card') && loops++ < 40) {
        var c2 = V.querySelector('#flash-card'); seen[c2.querySelector('.flash-main').textContent] = true;
        c2.click(); V.querySelector('#flash-hafal').click();
      }
      check(Object.keys(seen).length === total2 && /Semua kartu sudah hafal/.test(V.textContent), 'flashcard: "Sudah hafal" semua kartu -> selesai (' + Object.keys(seen).length + '/' + total2 + ' kartu terlihat)');
      var hf = Object.keys(w.VyLatihan.load().hafal).length;
      check(hf === total2, 'flashcard: ' + hf + ' kartu hafal tersimpan');
      V.querySelector('#flash-ulang').click();
      check(!!V.querySelector('#flash-card') && Object.keys(w.VyLatihan.load().hafal).length === 0, 'flashcard: "Ulangi semua kartu" mengosongkan hafal');
    } else if (r === 'latihan/glosarium') {
      var inp = V.querySelector('#gl-cari'), all = V.querySelectorAll('.gl').length;
      check(all === w.GLOSSARY.length, 'glosarium: ' + all + ' istilah tampil');
      inp.value = 'fvg'; inp.dispatchEvent(new w.Event('input'));
      var f = V.querySelectorAll('.gl');
      check(f.length >= 2 && f.length < all && Array.prototype.some.call(f, function (e) { return /FVG \(Fair/.test(e.textContent); }), 'glosarium: cari "fvg" -> ' + f.length + ' hasil');
      check(Array.prototype.some.call(V.querySelectorAll('.gl-link'), function (a) { return /#\/belajar\/fvg$/.test(a.getAttribute('href')); }), 'glosarium: tautan ke kartu materi FVG');
      inp.value = 'zzzzqq'; inp.dispatchEvent(new w.Event('input'));
      check(V.querySelectorAll('.gl').length === 0 && /Tidak ada istilah/.test(V.textContent), 'glosarium: tanpa hasil -> pesan kosong');
      inp.value = ''; inp.dispatchEvent(new w.Event('input'));
      check(V.querySelectorAll('.gl').length === all, 'glosarium: kosongkan pencarian -> semua istilah kembali');
    }
  }

  /* ===== Tab Jurnal (Tahap 6) ===== */
  function jurnalTest(w, d, next) {
    var V = d.getElementById('view'), J = w.VyJurnal;
    var ctl = V.querySelectorAll('#form input, #form select, #form textarea');
    // urutan: waktu, pair, arah, bias, TF entry, entry, SL, TP, hasil, checklist, catatan
    var fTime = ctl[0], fDir = ctl[2], fEntry = ctl[5], fSL = ctl[6], fTP = ctl[7], fRes = ctl[8], fChk = ctl[9], fNote = ctl[10];
    function put(el, v) { el.value = v; el.dispatchEvent(new w.Event('input', { bubbles: true })); el.dispatchEvent(new w.Event('change', { bubbles: true })); }
    check(ctl.length === 11 && /^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(fTime.value), 'jurnal: form lengkap (11 isian), tanggal+jam terisi otomatis');
    check(/Belum ada catatan/.test(V.textContent) && /Ekspor/.test(V.textContent) && /secara berkala/.test(V.textContent) && !/Segera hadir/.test(V.textContent), 'jurnal: kosong di awal, pengingat ekspor berkala tampil');
    put(fDir, 'LP'); put(fEntry, '2000'); put(fSL, '2010'); put(fTP, '2020');
    V.querySelector('#simpan').click();
    check(J.loadJurnal().entries.length === 0 && /SL harus di bawah/.test(V.querySelector('#rr').textContent), 'jurnal: SL salah sisi -> tidak tersimpan + pesan');
    put(fSL, '1990'); put(fTP, '2015');
    check(/1:1\.5/.test(V.querySelector('#rr').textContent) && V.querySelector('#rr').classList.contains('warn') && /di bawah 1:2/.test(V.querySelector('#rr').textContent), 'jurnal: RR 1:1.5 -> peringatan di bawah 1:2');
    put(fTP, '2020');
    check(/1:2/.test(V.querySelector('#rr').textContent) && !V.querySelector('#rr').classList.contains('warn'), 'jurnal: RR 1:2 -> tanpa peringatan');
    put(fTime, '2026-01-01T10:00'); put(fRes, 'tp'); put(fChk, 'valid'); put(fNote, 'contoh satu');
    V.querySelector('#simpan').click();
    check(J.loadJurnal().entries.length === 1 && V.querySelectorAll('article.jr').length === 1, 'jurnal: tambah catatan 1 -> tersimpan + tampil');
    check(fEntry.value === '' && fRes.value === 'open', 'jurnal: form dikosongkan setelah simpan');
    put(fTime, '2026-01-02T10:00'); put(fDir, 'SP'); put(fEntry, '2000'); put(fSL, '2010'); put(fTP, '1980'); put(fRes, 'sl'); put(fChk, 'belum');
    V.querySelector('#simpan').click();
    var arts = V.querySelectorAll('article.jr');
    check(arts.length === 2 && /2026-01-02/.test(arts[0].textContent) && /2026-01-01/.test(arts[1].textContent), 'jurnal: terbaru di atas');
    var stTxt = V.querySelector('#stat').textContent;
    check(/2 \(2 selesai\)/.test(stTxt) && /50%/.test(stTxt) && /\+1R/.test(stTxt), 'jurnal: statistik 2 setup, win rate 50%, total +1R');
    check(/VALID \(1 setup\)win 100% · \+2R/.test(stTxt) && /BELUM \(1 setup\)win 0% · -1R/.test(stTxt), 'jurnal: perbandingan VALID vs BELUM tampil');
    arts[0].querySelector('.jr-edit').click();
    check(/Edit setup/.test(V.querySelector('#form').textContent) && fEntry.value === '2000' && fDir.value === 'SP', 'jurnal: Edit mengisi form dengan data lama');
    put(fRes, 'tp'); V.querySelector('#simpan').click();
    var j2 = J.loadJurnal().entries;
    check(j2.length === 2 && j2.filter(function (e) { return e.result === 'tp'; }).length === 2 && /\+4R/.test(V.querySelector('#stat').textContent), 'jurnal: edit tersimpan tanpa duplikat, total +4R');
    w.localStorage.setItem('vytrade.setup', JSON.stringify({ dir: 'sell', checked: {} }));
    V.querySelector('#dari-setup').click();
    check(fChk.value === 'belum' && fDir.value === 'SP' && /BELUM/.test(V.querySelector('#chk-hint').textContent), 'jurnal: "Ambil dari tab Setup" -> BELUM + arah SP');
    var chk = {}; w.SETUP.required.forEach(function (r) { chk[r.id] = true; });
    w.localStorage.setItem('vytrade.setup', JSON.stringify({ dir: 'buy', checked: chk }));
    V.querySelector('#dari-setup').click();
    check(fChk.value === 'valid' && fDir.value === 'LP', 'jurnal: Setup lengkap -> VALID + arah LP');
    w.confirm = function () { return false; };
    V.querySelectorAll('article.jr')[1].querySelector('.jr-del').click();
    check(J.loadJurnal().entries.length === 2, 'jurnal: hapus dibatalkan -> data tetap');
    w.confirm = function () { return true; };
    V.querySelectorAll('article.jr')[1].querySelector('.jr-del').click();
    check(J.loadJurnal().entries.length === 1 && V.querySelectorAll('article.jr').length === 1, 'jurnal: hapus dikonfirmasi -> 1 catatan tersisa');
    var captured = null, origCreate = w.URL.createObjectURL;
    w.URL.createObjectURL = function (b) { captured = b; return origCreate.call(w.URL, b); };
    try { Object.defineProperty(w.navigator, 'canShare', { value: undefined, configurable: true }); } catch (e) {}
    V.querySelector('#ekspor').click();
    check(!!captured && /vytrade-cadangan-\d{4}-\d\d-\d\d\.json/.test(V.querySelector('#cad-msg').textContent), 'jurnal: ekspor memicu unduhan vytrade-cadangan-TANGGAL.json');
    captured.text().then(function (text) {
      var r = J.validateBackup(text);
      check(r.ok && r.summary.jurnal === 1, 'jurnal: isi file ekspor valid (1 jurnal)');
      J.saveJurnal({ v: 1, entries: [] });
      function pick(t) {
        var dt = new w.DataTransfer(); dt.items.add(new w.File([t], 'x.json', { type: 'application/json' }));
        var fi = V.querySelector('#impor-file'); fi.files = dt.files; fi.dispatchEvent(new w.Event('change'));
      }
      // Pembacaan file async: tunggu sampai hasilnya muncul (bukan jeda tetap) supaya uji tidak bergantung kecepatan.
      function until(cond, fn) { var n = 0; (function t() { if (cond() || ++n > 300) fn(); else setTimeout(t, 10); })(); }
      pick('{rusak');
      until(function () { return /Impor gagal/.test(V.querySelector('#cad-msg').textContent); }, function () {
        check(/Impor gagal/.test(V.querySelector('#cad-msg').textContent) && !V.querySelector('#impor-ya'), 'jurnal: impor file rusak -> pesan gagal, tanpa tombol timpa');
        pick(text);
        until(function () { return !!V.querySelector('#impor-ringkas'); }, function () {
          check(!!V.querySelector('#impor-ringkas') && /1 catatan jurnal/.test(V.querySelector('#impor-ringkas').textContent) && /kartu materi dibuka/.test(V.querySelector('#impor-ringkas').textContent) && J.loadJurnal().entries.length === 0, 'jurnal: impor file valid -> ringkasan tampil, data belum ditimpa (ringkasan: ' + (V.querySelector('#impor-ringkas') ? V.querySelector('#impor-ringkas').textContent : 'tidak ada; pesan: ' + V.querySelector('#cad-msg').textContent) + ')');
          V.querySelector('#impor-tidak').click();
          check(J.loadJurnal().entries.length === 0, 'jurnal: batal impor -> data tidak berubah');
          pick(text);
          until(function () { return !!V.querySelector('#impor-ya'); }, function () {
            V.querySelector('#impor-ya').click();
            check(J.loadJurnal().entries.length === 1 && V.querySelectorAll('article.jr').length === 1 && /Impor selesai/.test(V.querySelector('#cad-msg').textContent), 'jurnal: konfirmasi timpa -> data pulih + daftar diperbarui');
            next();
          });
        });
      });
    });
  }

  function step() {
    if (idx >= routes.length) return done();
    var r = routes[idx++];
    document.getElementById('out').textContent = lines.join('\n') + '\n... rute ' + idx + '/' + routes.length + ': ' + r; // kemajuan (terlihat kalau uji berhenti di tengah)
    pStart(); // Belajar juga menyimpan progres (kartu dibuka), jadi cadangkan data pengguna sejak rute pertama
    if (r === 'jurnal') localStorage.removeItem('vytrade.jurnal');
    errs = [];
    f.onload = function () {
      var w = f.contentWindow, d = f.contentDocument;
      w.addEventListener('error', function (e) { errs.push(e.message); });
      w.location.hash = '#/' + r;
      setTimeout(function () {
        var arts = d.querySelectorAll('article.ex'), svgs = d.querySelectorAll('svg.chart');
        var isTop = /^belajar\/topdown/.test(r), isSesi = r === 'belajar/sesi', isBelajarKonsep = /^belajar\/./.test(r) && !isTop && !isSesi && r !== 'belajar/tidak-ada';
        if (isBelajarKonsep) {
          var key = r.split('/')[1], cons = w.CONCEPTS.filter(function (c) { return c.id === key; })[0], exs = w.EXAMPLES[cons.examples];
          var wantSvgs = exs.reduce(function (n, e) { return n + (e.pair ? 2 : 1); }, 0);
          check(arts.length === exs.length && svgs.length === wantSvgs, r + ': ' + svgs.length + ' chart tampil untuk ' + arts.length + ' contoh (harap ' + wantSvgs + ')');
          // tiap chart punya candle (body+wick), label TF, tulisan Ilustrasi
          check(Array.prototype.every.call(svgs, function (s) {
            return s.querySelectorAll('rect.body').length >= 8 && s.querySelectorAll('line.wick').length >= 8 &&
                   /[A-Z0-9]{5,8} · M(1|5|15)(?!\d)/.test(s.textContent) && /Ilustrasi/.test(s.textContent);
          }), r + ': candle (body+wick), label "SIMBOL · M5/M15", dan "Ilustrasi" ada di semua chart');
          // tombol zona: awalnya tersembunyi, menyala, lalu mati lagi
          var okBtn = true;
          Array.prototype.forEach.call(arts, function (a) {
            var ss = a.querySelectorAll('svg.chart'), s = ss[0], b = a.querySelector('button.btn');
            function allOff(v) { return Array.prototype.every.call(ss, function (x) { return x.classList.contains('ov-off') === v; }); }
            var off0 = allOff(true);
            b.click();
            var on1 = allOff(false) && /Sembunyikan/.test(b.textContent);
            var shown = s.querySelectorAll('g.ov text, g.ov rect, g.ov line').length;
            b.click();
            var off2 = allOff(true) && /Tampilkan/.test(b.textContent);
            if (!(off0 && on1 && off2 && shown > 0)) okBtn = false;
            if (keepOn) b.click();
          });
          check(okBtn, r + ': tombol zona: mati -> nyala -> mati, overlay ada isinya');
          if (r === 'belajar/ob' || r === 'belajar/fvg') check(/FVG atau OB, pilih yang mana\?/.test(d.getElementById('view').textContent), r + ': bagian "FVG atau OB, pilih yang mana?" tampil');
          check(!/undefined|NaN/.test(d.getElementById('view').innerHTML), r + ': tidak ada "undefined"/"NaN" di halaman');
          check(w.VyProgres.load().opened[key] === true, r + ': kartu ditandai sudah dibuka di progres peta belajar');
          // Tahap 8: kartu baru
          if (/^belajar\/(hammer|engulfing|doji|expansion|consolidation|reversal|breaker|cisd|qml|inducement|amd)$/.test(r)) {
            var tx8 = Array.prototype.map.call(svgs, function (x) { return x.textContent; }).join(' ');
            var need8 = { hammer: ['OB', 'Hammer', 'Shooting star', 'Sweep', 'CHoCH', 'LP', 'SP', 'TP', 'SL', 'Entry', 'XAUUSD · M15'],
                          engulfing: ['FVG', 'Engulfing', 'Inside bar', 'Mother', 'CHoCH', 'LP', 'SP', 'TP', 'SL', 'Entry', 'XAUUSD · M15'],
                          doji: ['FVG', 'Doji', 'Marubozu', 'CHoCH', 'LP', 'SP', 'TP', 'SL', 'Entry', 'XAUUSD · M15'],
                          expansion: ['FVG', 'Ekspansi', 'CHoCH', 'LP', 'SP', 'TP', 'SL', 'Entry', 'XAUUSD · M15'],
                          consolidation: ['Range', 'FVG', 'Breakout', 'Fakeout', 'LP', 'SP', 'TP', 'SL', 'Entry', 'XAUUSD · M15'],
